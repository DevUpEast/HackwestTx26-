{% extends "base.html" %}

{% block title %}Sign up | Hackwest{% endblock %}

{% block content %}
<section class="auth-panel">
    <p class="eyebrow">Join the build</p>
    <h1>Create account</h1>
    <p class="muted">Your profile will be saved securely in the database.</p>
    <form class="auth-form" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" minlength="3" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>
        <button class="button button-dark" type="submit">Create account</button>
    </form>
    <p class="form-footer">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
