{% extends "base.html" %}

{% block title %}Log in | Hackwest{% endblock %}

{% block content %}
<section class="auth-panel">
    <p class="eyebrow">Welcome back</p>
    <h1>Log in</h1>
    <p class="muted">Pick up where you left off.</p>
    <form class="auth-form" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="button button-dark" type="submit">Log in</button>
    </form>
    <p class="form-footer">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</section>
{% endblock %}
