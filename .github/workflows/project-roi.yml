name: Project ROI

# Recalculates the ROI field on the project board.
# GitHub Projects has no formula fields, so this runs on a schedule and on demand.
#
# Requires:
#   - secret  PROJECT_TOKEN   : a token with the `project` scope (classic PAT or gh token)
#   - variable PROJECT_NUMBER : the project number from its URL (github.com/users/<owner>/projects/<number>)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened]

permissions:
  contents: read

concurrency:
  group: project-roi
  cancel-in-progress: true

jobs:
  recalc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recalculate ROI
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const compute = require('./.github/scripts/compute-roi.js');
            await compute({
              github,
              core,
              owner: context.repo.owner,
              projectNumber: Number(process.env.PROJECT_NUMBER),
            });
        env:
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
